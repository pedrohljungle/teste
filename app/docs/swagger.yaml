basePath: /
definitions:
  health.Status:
    properties:
      role:
        example: server
        type: string
      service:
        example: pedro-test-server
        type: string
      status:
        example: ok
        type: string
      version:
        example: 1.4.0
        type: string
    type: object
  structs.APIError:
    properties:
      failureCode:
        description: |-
          FailureCode is the stable, documented reason of a business rejection or of an invalid
          operation. It is what a provider reads to tell an input it can correct from a definitive
          outcome, and it is absent on errors that are not about the operation itself.
        example: INSUFFICIENT_FUNDS
        type: string
      message:
        example: invalid token
        type: string
    type: object
  structs.MoneyDTO:
    properties:
      amount:
        example: "25.00"
        type: string
      currency:
        example: BRL
        type: string
    type: object
  structs.Principal:
    properties:
      email:
        type: string
      provider_id:
        description: |-
          ProviderID is the provider this identity acts as, from the provider_id claim of its
          token. It is empty for anyone that is not a provider. The provider a request may act for
          comes from here and never from what the request says about itself.
        type: string
      roles:
        items:
          type: string
        type: array
      sub:
        type: string
      username:
        type: string
    type: object
  wagering.SubmitRequest:
    properties:
      externalTransactionId:
        example: transaction-123
        type: string
      gameId:
        example: fortune-chimp
        type: string
      kind:
        enum:
        - BET
        - WIN
        - LOSS
        - REFUND
        - ROLLBACK
        example: BET
        type: string
      money:
        $ref: '#/definitions/structs.MoneyDTO'
      playerId:
        example: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
        type: string
      providerId:
        example: provider-a
        type: string
      referenceExternalTransactionId:
        example: transaction-122
        type: string
      roundId:
        example: round-987
        type: string
      walletId:
        example: 0192f291-27dd-7d3f-8071-5f8685deef37
        type: string
    type: object
  wagering.TransactionDetail:
    properties:
      balance:
        $ref: '#/definitions/structs.MoneyDTO'
      createdAt:
        example: "2026-09-08T12:00:00.000Z"
        type: string
      expiresAt:
        example: "2026-09-09T12:00:00.000Z"
        type: string
      externalTransactionId:
        example: transaction-123
        type: string
      failureCode:
        example: INSUFFICIENT_FUNDS
        type: string
      gameId:
        example: fortune-chimp
        type: string
      kind:
        enum:
        - BET
        - WIN
        - LOSS
        - REFUND
        - ROLLBACK
        example: BET
        type: string
      money:
        $ref: '#/definitions/structs.MoneyDTO'
      nextAttemptAt:
        example: "2026-09-08T12:00:05.000Z"
        type: string
      playerId:
        example: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
        type: string
      providerId:
        example: provider-a
        type: string
      referenceAttempts:
        example: 3
        type: integer
      referenceExternalTransactionId:
        example: transaction-122
        type: string
      roundId:
        example: round-987
        type: string
      settledAt:
        example: "2026-09-08T12:00:00.000Z"
        type: string
      status:
        enum:
        - PENDING
        - PENDING_REFERENCE
        - PROCESSED
        - REJECTED
        - FAILED
        example: PROCESSED
        type: string
      transactionId:
        example: 0192f298-345e-7e38-af88-e43f851a819d
        type: string
      updatedAt:
        example: "2026-09-08T12:00:00.000Z"
        type: string
      walletId:
        example: 0192f291-27dd-7d3f-8071-5f8685deef37
        type: string
    type: object
  wagering.TransactionResponse:
    properties:
      balance:
        $ref: '#/definitions/structs.MoneyDTO'
      failureCode:
        example: INSUFFICIENT_FUNDS
        type: string
      idempotentReplay:
        example: false
        type: boolean
      status:
        enum:
        - PROCESSED
        - REJECTED
        - PENDING_REFERENCE
        - FAILED
        example: PROCESSED
        type: string
      transactionId:
        example: 0192f298-345e-7e38-af88-e43f851a819d
        type: string
    type: object
  wallet.LedgerEntryResponse:
    properties:
      balanceAfter:
        $ref: '#/definitions/structs.MoneyDTO'
      balanceBefore:
        $ref: '#/definitions/structs.MoneyDTO'
      createdAt:
        example: "2026-09-08T12:00:00.000Z"
        type: string
      direction:
        enum:
        - DEBIT
        - CREDIT
        example: DEBIT
        type: string
      id:
        example: 0192f2a1-4d3e-7b1a-9c55-0f1e2d3c4b5a
        type: string
      money:
        $ref: '#/definitions/structs.MoneyDTO'
      transactionId:
        example: 0192f298-345e-7e38-af88-e43f851a819d
        type: string
    type: object
  wallet.LedgerResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/wallet.LedgerEntryResponse'
        type: array
      nextCursor:
        description: 'NextCursor is absent on the last page. It is opaque: hand it
          back unchanged.'
        example: djEuNDI
        type: string
    type: object
  wallet.OpenRequest:
    properties:
      initialBalance:
        $ref: '#/definitions/structs.MoneyDTO'
      playerId:
        example: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
        type: string
    type: object
  wallet.ReconciliationResponse:
    properties:
      calculatedBalance:
        $ref: '#/definitions/structs.MoneyDTO'
      checkedEntries:
        example: 2
        type: integer
      consistent:
        example: true
        type: boolean
      difference:
        allOf:
        - $ref: '#/definitions/structs.MoneyDTO'
        description: Difference is the stored balance minus the calculated one.
      storedBalance:
        $ref: '#/definitions/structs.MoneyDTO'
      walletId:
        example: 0192f291-27dd-7d3f-8071-5f8685deef37
        type: string
    type: object
  wallet.Response:
    properties:
      balance:
        $ref: '#/definitions/structs.MoneyDTO'
      id:
        example: 0192f291-27dd-7d3f-8071-5f8685deef37
        type: string
      playerId:
        example: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
        type: string
      version:
        example: 1
        type: integer
    type: object
info:
  contact: {}
  description: 'Carteiras de jogadores e operações de provedores de jogos: apostas,
    prêmios, derrotas, estornos e reversões.'
  title: pedro-test
  version: "1.0"
paths:
  /health:
    get:
      description: Aberta de propósito, para um orquestrador sem token conseguir perguntar.
        Diz também qual aplicação e versão respondeu.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.Status'
      summary: Liveness
      tags:
      - operations
  /me:
    get:
      description: 'Devolve quem chamou, como o realm descreveu: subject, username,
        e-mail e papéis.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.Principal'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Quem sou eu
      tags:
      - identity
  /providers/{providerId}/wagering/transactions/{externalTransactionId}:
    get:
      description: 'O providerId do caminho precisa ser o do token: outro é 403, decidido
        antes de tocar em qualquer dado.'
      parameters:
      - description: Id do provedor, o mesmo do token
        in: path
        name: providerId
        required: true
        type: string
      - description: Id que o provedor deu à transação
        in: path
        name: externalTransactionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wagering.TransactionDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/structs.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/structs.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Lê uma transação pelo id do provedor
      tags:
      - wagering
  /wagering/transactions:
    post:
      consumes:
      - application/json
      description: |-
        Aplica BET, WIN, LOSS, REFUND ou ROLLBACK a uma carteira, uma única vez, por mais que seja reenviada. O header Idempotency-Key é obrigatório e nunca é substituído pelo servidor. Mesma chave e mesmo conteúdo devolvem o resultado gravado, com o saldo observado no processamento original (200 ou 422, com idempotentReplay true). Mesma chave com outro conteúdo, ou a mesma operação sob outra chave, é 409. O providerId do corpo precisa ser o do token.
        Distinguível pelo status: 200 processada, 202 aguardando referência, 400 entrada inválida (nada gravado), 409 conflito de idempotência, 422 rejeição de negócio (com failureCode, gravada e reproduzível), 503 indisponibilidade transitória (tente de novo).
      parameters:
      - description: Chave escolhida pelo provedor, por exemplo provider-a:transaction-123
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: A operação
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wagering.SubmitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wagering.TransactionResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/wagering.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/structs.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/structs.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/structs.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/wagering.TransactionResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Envia uma operação de um provedor
      tags:
      - wagering
  /wagering/transactions/{transactionId}:
    get:
      description: 'Permite acompanhar uma pendência (tentativas, próxima olhada e
        expiração) e consultar o código de uma rejeição ou falha. Uma transação de
        outro provedor responde 404, exatamente como uma que não existe: perguntar
        não revela de quem é.'
      parameters:
      - description: Id da transação
        in: path
        name: transactionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wagering.TransactionDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/structs.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/structs.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/structs.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Lê uma transação pelo id
      tags:
      - wagering
  /wallets:
    post:
      consumes:
      - application/json
      description: Cria a carteira na moeda do saldo inicial. Com saldo positivo,
        cria também a transação OPENING, o crédito no ledger e os eventos, no mesmo
        commit. Com saldo zero, cria só a carteira. Restrita ao serviço interno.
      parameters:
      - description: Jogador e saldo inicial
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.OpenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/wallet.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/structs.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/structs.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/structs.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Abre a carteira de um jogador
      tags:
      - wallets
  /wallets/{walletId}:
    get:
      description: Devolve o saldo e a versão atuais. Restrita ao serviço interno.
      parameters:
      - description: Id da carteira
        in: path
        name: walletId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/structs.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/structs.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/structs.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Lê uma carteira
      tags:
      - wallets
  /wallets/{walletId}/ledger:
    get:
      description: 'Paginado por cursor opaco, do lançamento mais antigo para o mais
        novo. A ordem é a posição que o banco deu a cada lançamento, que não muda
        nem se repete: um lançamento gravado enquanto o cliente lê aparece numa página
        posterior, e nenhum é pulado nem visto duas vezes. Restrita ao serviço interno.'
      parameters:
      - description: Id da carteira
        in: path
        name: walletId
        required: true
        type: string
      - description: Cursor devolvido pela página anterior
        in: query
        name: cursor
        type: string
      - description: Tamanho da página, de 1 a 200. Padrão 50.
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet.LedgerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/structs.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/structs.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/structs.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Lê o ledger de uma carteira
      tags:
      - wallets
  /wallets/{walletId}/reconciliation:
    post:
      description: 'Reconstrói o saldo a partir do ledger, abertura incluída, e compara
        com o saldo gravado, os dois lidos de uma mesma visão consistente dos dados.
        Não altera nada: uma divergência vai na resposta, no log e numa métrica, e
        nunca é corrigida. Restrita ao serviço interno.'
      parameters:
      - description: Id da carteira
        in: path
        name: walletId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet.ReconciliationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/structs.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/structs.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/structs.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/structs.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/structs.APIError'
      security:
      - OAuth2Password: []
      summary: Reconcilia uma carteira
      tags:
      - wallets
securityDefinitions:
  OAuth2Password:
    flow: password
    scopes:
      openid: Acesso à API
    tokenUrl: http://localhost:8080/realms/pedro-test/protocol/openid-connect/token
    type: oauth2
swagger: "2.0"
